<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie</title>
</head>
<body>
    <h1>Фильмы Марвел</h1>

    {% for movie in movies %}
    <div class="card">
        {% if movie.image %}
            <img src="{{ movie.image.url }}" width="1000">
        {% endif %}
        <div class="card-body">
            <h3 class="card-title">{{ movie.title }} ({{ movie.year }})</h3>
            <p class="card-text">{{ movie.description }}</p>
        </div>
    </div>
    {% endfor %}
</body>
</html>
